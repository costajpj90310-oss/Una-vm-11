version: '3.8'

services:
  windows11:
    image: dockur/windows:latest
    container_name: win11_codespace
    environment:
      VERSION: "11"
      RAM_SIZE: "4G"      # Aloque pelo menos 4G (Codespaces padrão tem 8GB total)
      CPU_CORES: "2"      # Ajuste conforme o tamanho do seu Codespace
      DISK_SIZE: "64G"    # Espaço em disco virtualizado
    devices:
      - /dev/kvm:/dev/kvm # Essencial para aceleração de hardware (KVM)
    cap_add:
      - NET_ADMIN
    ports:
      - "8006:8006"       # Porta requisitada mapeada para o noVNC Web
      - "3389:3389/tcp"   # Opcional: RDP tradicional se preferir
      - "3389:3389/udp"
    stop_grace_period: 2m
    restart: always       # Ajuda a manter o container ativo
